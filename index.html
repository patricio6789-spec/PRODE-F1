<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body { background: #070707; color: #f3f4f6; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  table { border-collapse: collapse; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .overflow-x-auto { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ── RESPONSIVE ── */
  :root { --max-w: 900px; --pad: 16px; }

  @media (max-width: 600px) {
    :root { --pad: 12px; }
    .hide-mobile { display: none !important; }
    .mobile-full { width: 100% !important; }
    .mobile-stack { flex-direction: column !important; }
    .mobile-small { font-size: 10px !important; }
    .mobile-p { padding: 6px 8px !important; }
  }
  @media (min-width: 601px) {
    .show-mobile-only { display: none !important; }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.7); }
    70%  { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes barRise {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: 1000; }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes shimmer {
    0%   { opacity: 0.6; }
    50%  { opacity: 1; }
    100% { opacity: 0.6; }
  }

  .anim-fade-up   { animation: fadeSlideUp 0.35s ease both; }
  .anim-fade-in   { animation: fadeIn 0.3s ease both; }
  .anim-pop       { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
  .anim-slide-in  { animation: fadeSlideIn 0.3s ease both; }

</style>

function teamStyle(name) {
  if (!name || name === "–" || name === "-") return null;
  const key = name.trim().toUpperCase();
  return TEAM_COLORS[key] || null;
}

function abbr(n){ if(!n||n==="–"||n==="-") return "–"; const u=n.trim().toUpperCase(); return ABBRMAP[u]||u.slice(0,3); }
function isHit(p,r){ if(!p||!r||p==="–"||p==="-") return false; return p.trim().toUpperCase()===r.trim().toUpperCase(); }
function medalStyle(rank){
  if(rank===0) return {background:"#78600a88",color:"#fbbf24",border:"1px solid #f59e0b"};
  if(rank===1) return {background:"#37415188",color:"#d1d5db",border:"1px solid #9ca3af"};
  if(rank===2) return {background:"#43140788",color:"#fb923c",border:"1px solid #ea580c"};
  return {color:"#6b7280"};
}


function FlagImg({code, size=20}) {
  const src = FLAGS[code];
  if (!src) return <span style={{fontSize:size*0.9}}></span>;
  return <img src={src} alt={code} style={{width:size*1.4, height:size, objectFit:"cover", borderRadius:2, verticalAlign:"middle", display:"inline-block"}} />;
}

                </div>
              );
            })}

              </thead>

                {data.sessions.map((s,i)=>(
                  <tr key={i} className="anim-fade-in" style={{animationDelay:`${i*0.025}s`,borderBottom:"1px solid #0d0d0d",background:i%2===0?"#050505":"transparent"}}>
                    <td style={{padding:"7px 12px",color:"#6b7280",fontSize:11,fontFamily:"monospace",whiteSpace:"nowrap"}}>{s.label}</td>
                    {PARTICIPANTS.map(p=>{
                      const hit=isHit(s.preds[p],s.real);
                      const predName=s.preds[p]||"–";
                      const ts=teamStyle(predName);
                      return <td key={p} style={{padding:"4px 4px",textAlign:"center"}}>
                        {predName==="–"||!ts ? (
                          <span style={{fontSize:10,fontFamily:"monospace",color:"#374151"}}>–</span>

                          <span style={{
                            display:"inline-flex",alignItems:"center",gap:3,
                            background:ts.bg+"28",

                            border:`1px solid ${ts.bg}88`,
                            borderRadius:4,
                            padding:"2px 5px",
                            fontSize:10,
                            fontFamily:"monospace",
                            fontWeight:700,
                            lineHeight:1.3,
                          }}>
                            {abbr(predName)}
                            {hit && <span style={{color:"#22c55e",fontWeight:900,fontSize:11}}>✓</span>}
                          </span>
                        )}
                      </td>;
                    })}
                    {(() => {
                      const rts=teamStyle(s.real);
                      return <td style={{padding:"4px 4px",textAlign:"center"}}>
                        {rts ? (
                          <span style={{
                            display:"inline-flex",alignItems:"center",
                            background:rts.bg,
                            color:rts.text,
                            borderRadius:4,
                            padding:"2px 6px",
                            fontSize:10,
                            fontFamily:"monospace",
                            fontWeight:700,
                            lineHeight:1.3,
                          }}>{abbr(s.real)}</span>
                        ) : (
                          <span style={{fontSize:10,fontFamily:"monospace",fontWeight:700,color:"#fbbf24"}}>{abbr(s.real)}</span>
                        )}
                      </td>;
                    })()}
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr style={{background:"#0a0a0a",borderTop:"2px solid #1f2937"}}>
                  <td style={{padding:"8px 12px",fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em"}}>ACIERTOS</td>
                  {PARTICIPANTS.map(p=>{
                    const hits=data.sessions.filter(s=>isHit(s.preds[p],s.real)).length;
                    const pct=Math.round((hits/data.sessions.length)*100);
                    const m=PM[p];
                    return <td key={p} style={{padding:"8px 8px",textAlign:"center"}}>
                      <div style={{color:m.color,fontSize:11,fontWeight:700,fontFamily:"monospace"}}>{hits}<span style={{color:"#4b5563"}}>/{data.sessions.length}</span></div>
                      <div style={{color:"#374151",fontSize:10}}>{pct}%</div>
                    </td>;
                  })}
                  <td/>
                </tr>
              </tfoot>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

function ChartLine() {
  const [hovI, setHovI] = useState(null);
  const W=680, H=300, PAD={top:24,right:24,bottom:48,left:48};
  const IW=W-PAD.left-PAD.right, IH=H-PAD.top-PAD.bottom;
  const races=RACES.filter(r=>r.status==="completado"&&RACE_DATA[r.id]);
  const n=races.length+1;
  const series=PARTICIPANTS.map(p=>{
    let cum=0;
    const pts=[0,...races.map(r=>{cum+=(RACE_DATA[r.id]?.scores?.[p]||0);return cum;})];
    return {name:p,pts,color:PM[p].color};
  });
  const maxY=Math.max(...series.map(s=>Math.max(...s.pts)),50);
  const xPos=i=>PAD.left+i*(IW/(n-1));
  const yPos=v=>PAD.top+IH-(v/maxY)*IH;
  const yTicks=[0,50,100,150,200,250,300].filter(v=>v<=maxY+30);
  const xLabels=["Inicio",...races.map(r=>r.name)];
  const tooltipSorted=hovI!==null?[...series].sort((a,b)=>b.pts[hovI]-a.pts[hovI]):[];
  const handleMM=(e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    let best=0,bestD=9999;
    for(let i=0;i<n;i++){const d=Math.abs(mx-xPos(i));if(d<bestD){bestD=d;best=i;}}
    setHovI(bestD<(IW/(n-1))*0.65?best:null);
  };
  const tooltipLeft=hovI!==null&&hovI<n/2?xPos(hovI)+20:undefined;
  const tooltipRight=hovI!==null&&hovI>=n/2?W-xPos(hovI)+20:undefined;
  return (
    <div>
      <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>Evolución de Puntos Acumulados</p>
      <p style={{fontSize:11,color:"#374151",marginBottom:12}}>Puntos totales tras cada fecha — pasá el mouse por el gráfico</p>
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16,position:"relative",overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",maxWidth:W,cursor:"crosshair"}} preserveAspectRatio="xMidYMid meet"
          onMouseMove={handleMM}
          onTouchMove={e=>{e.preventDefault();const t=e.touches[0];if(t){const rect=e.currentTarget.getBoundingClientRect();const mx=(t.clientX-rect.left)*(W/rect.width);let best=0,bestD=9999;for(let i=0;i<n;i++){const d=Math.abs(mx-xPos(i));if(d<bestD){bestD=d;best=i;}}setHovI(bestD<(IW/(n-1))*0.8?best:null);}}}
          onTouchEnd={()=>setHovI(null)}
          onMouseLeave={()=>setHovI(null)}>
          {yTicks.map(v=>(
            <g key={v}>
              <line x1={PAD.left} x2={PAD.left+IW} y1={yPos(v)} y2={yPos(v)} stroke="#161616" strokeWidth={1}/>
              <text x={PAD.left-6} y={yPos(v)+4} textAnchor="end" fontSize={9} fill="#374151">{v}</text>
            </g>
          ))}
          {xLabels.map((lbl,i)=>(
            <g key={i}>
              <text x={xPos(i)} y={H-PAD.bottom+14} textAnchor="middle" fontSize={9} fontWeight="600"
                fill={hovI===i?"#9ca3af":"#374151"}>{i===0?"▶":races[i-1]?.flagCode?.toUpperCase()||""}</text>
              <text x={xPos(i)} y={H-PAD.bottom+26} textAnchor="middle" fontSize={8}
                fill={hovI===i?"#6b7280":"#1f2937"}>{i===0?"":lbl.slice(0,6)}</text>
            </g>
          ))}
          {hovI!==null&&<line x1={xPos(hovI)} x2={xPos(hovI)} y1={PAD.top} y2={PAD.top+IH}
            stroke="#ffffff" strokeWidth={1} strokeDasharray="3,3" opacity={0.15}/>}
          {series.map(s=>(
            <polyline key={s.name} fill="none" stroke={s.color}
              strokeWidth={hovI!==null?1.5:2.5} strokeLinejoin="round" strokeLinecap="round" opacity={0.9}
              strokeDasharray="2000" strokeDashoffset="0"
              style={{animation:"drawLine 1.2s ease forwards",animationDelay:`${series.indexOf(s)*0.15}s`}}
              points={s.pts.map((v,i)=>`${xPos(i)},${yPos(v)}`).join(" ")}/>
          ))}
          {series.map(s=>s.pts.map((v,i)=>{
            const isH=hovI===i, isL=i===s.pts.length-1;
            return (
              <g key={s.name+i}>
                <circle cx={xPos(i)} cy={yPos(v)} r={isH?6:isL?4:2.5}
                  fill={isH||isL?s.color:"#050505"} stroke={s.color} strokeWidth={isH?3:1.5}
                  style={{animation:"popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both",animationDelay:`${(series.indexOf(s)*n+i)*0.05}s`}}/>
                {isL&&hovI===null&&<text x={xPos(i)+8} y={yPos(v)+4} fontSize={9} fontWeight="700" fill={s.color}>{v}</text>}
              </g>
            );
          }))}
          <line x1={PAD.left} x2={PAD.left} y1={PAD.top} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
          <line x1={PAD.left} x2={PAD.left+IW} y1={PAD.top+IH} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
        </svg>
        {hovI!==null&&(
          <div style={{position:"absolute",top:16,left:tooltipLeft!==undefined?Math.min(tooltipLeft,W-180):undefined,right:tooltipRight!==undefined?Math.min(tooltipRight,W-180):undefined,background:"rgba(8,8,8,0.97)",border:"1px solid #1f2937",borderRadius:10,padding:"10px 14px",minWidth:150,maxWidth:200,pointerEvents:"none",zIndex:10}}>
            <div style={{fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em",marginBottom:8,borderBottom:"1px solid #1a1a1a",paddingBottom:6}}>
              {hovI===0?"🏁 Inicio":"🏎 "+races[hovI-1]?.name}
            </div>
            {tooltipSorted.map((s,rank)=>(
              <div key={s.name} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={{fontSize:10,color:"#374151",width:16,textAlign:"right",fontFamily:"monospace"}}>{rank+1}</span>
                <Avatar name={s.name} size="sm"/>
                <span style={{color:s.color,fontWeight:700,fontSize:12,flex:1}}>{s.name}</span>
                <span style={{color:"white",fontWeight:900,fontSize:13,fontFamily:"monospace"}}>{s.pts[hovI]}</span>
              </div>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap",marginTop:8}}>
          {[...series].sort((a,b)=>b.pts[b.pts.length-1]-a.pts[a.pts.length-1]).map(s=>(
            <div key={s.name} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:20,height:3,background:s.color,borderRadius:2}}/>
              <span style={{fontSize:11,color:s.color,fontWeight:600}}>{s.name}</span>
              <span style={{fontSize:10,color:"#4b5563"}}>{s.pts[s.pts.length-1]} pts</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ChartGap() {
  const [hovI, setHovI] = useState(null);
  const W=680, H=280, PAD={top:24,right:24,bottom:48,left:48};
  const IW=W-PAD.left-PAD.right, IH=H-PAD.top-PAD.bottom;
  const races=RACES.filter(r=>r.status==="completado"&&RACE_DATA[r.id]);
  const n=races.length+1;
  const cumMap={};
  PARTICIPANTS.forEach(p=>{
    let c=0;
    cumMap[p]=[0,...races.map(r=>{c+=(RACE_DATA[r.id]?.scores?.[p]||0);return c;})];
  });
  const gapSeries=PARTICIPANTS.map(p=>{
    const gaps=Array.from({length:n},(_,i)=>{
      const leader=Math.max(...PARTICIPANTS.map(pp=>cumMap[pp][i]));
      return leader-cumMap[p][i];
    });
    return {name:p,gaps,color:PM[p].color};
  });
  const maxGap=Math.max(...gapSeries.map(s=>Math.max(...s.gaps)),10);
  const xPos=i=>PAD.left+i*(IW/(n-1));
  const yPos=v=>PAD.top+(v/maxGap)*IH;
  const gapTicks=[0,10,20,30,40,50,60,70].filter(v=>v<=maxGap+10);
  const xLabels=["Inicio",...races.map(r=>r.name)];
  const tooltipSorted=hovI!==null?[...gapSeries].sort((a,b)=>a.gaps[hovI]-b.gaps[hovI]):[];
  const tLeft=hovI!==null&&hovI<n/2?xPos(hovI)+20:undefined;
  const tRight=hovI!==null&&hovI>=n/2?W-xPos(hovI)+20:undefined;
  const handleMM=(e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    let best=0,bestD=9999;
    for(let i=0;i<n;i++){const d=Math.abs(mx-xPos(i));if(d<bestD){bestD=d;best=i;}}
    setHovI(bestD<(IW/(n-1))*0.65?best:null);
  };
  return (
    <div>
      <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>Diferencia con el Líder</p>
      <p style={{fontSize:11,color:"#374151",marginBottom:12}}>Puntos de distancia al primero tras cada fecha — 0 = líder</p>
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16,position:"relative",overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",maxWidth:W,cursor:"crosshair"}} preserveAspectRatio="xMidYMid meet"
          onMouseMove={handleMM}
          onTouchMove={e=>{e.preventDefault();const t=e.touches[0];if(t){const rect=e.currentTarget.getBoundingClientRect();const mx=(t.clientX-rect.left)*(W/rect.width);let best=0,bestD=9999;for(let i=0;i<n;i++){const d=Math.abs(mx-xPos(i));if(d<bestD){bestD=d;best=i;}}setHovI(bestD<(IW/(n-1))*0.8?best:null);}}}
          onTouchEnd={()=>setHovI(null)}
          onMouseLeave={()=>setHovI(null)}>
          {gapTicks.map(v=>(
            <g key={v}>
              <line x1={PAD.left} x2={PAD.left+IW} y1={yPos(v)} y2={yPos(v)}
                stroke={v===0?"#2a2a00":"#161616"} strokeWidth={v===0?1.5:1}/>
              <text x={PAD.left-6} y={yPos(v)+4} textAnchor="end" fontSize={9}
                fill={v===0?"#fbbf2455":"#374151"}>{v===0?"👑":`-${v}`}</text>
            </g>
          ))}
          {xLabels.map((lbl,i)=>(
            <g key={i}>
              <text x={xPos(i)} y={H-PAD.bottom+14} textAnchor="middle" fontSize={9} fontWeight="600"
                fill={hovI===i?"#9ca3af":"#374151"}>{i===0?"▶":races[i-1]?.flagCode?.toUpperCase()||""}</text>
              <text x={xPos(i)} y={H-PAD.bottom+26} textAnchor="middle" fontSize={8}
                fill={hovI===i?"#6b7280":"#1f2937"}>{i===0?"":lbl.slice(0,6)}</text>
            </g>
          ))}
          {hovI!==null&&<line x1={xPos(hovI)} x2={xPos(hovI)} y1={PAD.top} y2={PAD.top+IH}
            stroke="#ffffff" strokeWidth={1} strokeDasharray="3,3" opacity={0.15}/>}
          {gapSeries.map(s=>(
            <polyline key={s.name} fill="none" stroke={s.color}
              strokeWidth={hovI!==null?1.5:2.5} strokeLinejoin="round" strokeLinecap="round" opacity={0.9}
              strokeDasharray="2000" strokeDashoffset="0"
              style={{animation:"drawLine 1.2s ease forwards",animationDelay:`${gapSeries.indexOf(s)*0.15}s`}}
              points={s.gaps.map((v,i)=>`${xPos(i)},${yPos(v)}`).join(" ")}/>
          ))}
          {gapSeries.map(s=>s.gaps.map((v,i)=>{
            const isH=hovI===i, isL=i===s.gaps.length-1;
            return (
              <g key={s.name+i}>
                <circle cx={xPos(i)} cy={yPos(v)} r={isH?6:isL?4:2.5}
                  fill={isH||isL?s.color:"#050505"} stroke={s.color} strokeWidth={isH?3:1.5}

        </svg>
        {hovI!==null&&(
          <div style={{position:"absolute",top:16,left:tLeft,right:tRight,background:"rgba(8,8,8,0.97)",border:"1px solid #1f2937",borderRadius:10,padding:"10px 14px",minWidth:165,pointerEvents:"none",zIndex:10}}>
            <div style={{fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em",marginBottom:8,borderBottom:"1px solid #1a1a1a",paddingBottom:6}}>
              {hovI===0?"🏁 Inicio":"🏎 "+races[hovI-1]?.name}
            </div>
            {tooltipSorted.map((s,rank)=>(
              <div key={s.name} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={{fontSize:10,color:"#374151",width:16,textAlign:"right",fontFamily:"monospace"}}>{rank+1}</span>
                <Avatar name={s.name} size="sm"/>
                <span style={{color:s.color,fontWeight:700,fontSize:12,flex:1}}>{s.name}</span>
                <span style={{color:s.gaps[hovI]===0?"#fbbf24":"white",fontWeight:900,fontSize:13,fontFamily:"monospace"}}>
                  {s.gaps[hovI]===0?"👑":`-${s.gaps[hovI]}`}
                </span>
              </div>

          </div>

        <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap",marginTop:8}}>
          {[...gapSeries].sort((a,b)=>a.gaps[a.gaps.length-1]-b.gaps[b.gaps.length-1]).map(s=>(
            <div key={s.name} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:20,height:3,background:s.color,borderRadius:2}}/>
              <span style={{fontSize:11,color:s.color,fontWeight:600}}>{s.name}</span>
              <span style={{fontSize:10,color:"#4b5563"}}>{s.gaps[s.gaps.length-1]===0?"líder":`-${s.gaps[s.gaps.length-1]}`}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ChartBars() {
  const [hovR, setHovR] = useState(null);
  const races=RACES.filter(r=>r.status==="completado"&&RACE_DATA[r.id]);
  const W=680, H=260, PAD={top:20,right:20,bottom:50,left:40};
  const IW=W-PAD.left-PAD.right, IH=H-PAD.top-PAD.bottom;
  const nR=races.length, nP=PARTICIPANTS.length;
  const groupW=IW/nR;
  const barW=Math.min((groupW-10)/nP,20);
  const maxPts=80;
  const yPos=v=>PAD.top+IH-(v/maxPts)*IH;
  const yTicks=[0,20,40,60,80];
  return (
    <div>
      <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>Puntos por Fecha — Comparativo</p>
      <p style={{fontSize:11,color:"#374151",marginBottom:12}}>Puntos obtenidos en cada gran premio — pasá el mouse sobre las barras</p>
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16,position:"relative",overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",maxWidth:W}} preserveAspectRatio="xMidYMid meet"
          onMouseLeave={()=>setHovR(null)} onTouchEnd={()=>setHovR(null)}>
          {yTicks.map(v=>(
            <g key={v}>
              <line x1={PAD.left} x2={PAD.left+IW} y1={yPos(v)} y2={yPos(v)} stroke="#161616" strokeWidth={1}/>
              <text x={PAD.left-4} y={yPos(v)+4} textAnchor="end" fontSize={9} fill="#374151">{v}</text>
            </g>
          ))}
          {races.map((r,ri)=>{
            const gx=PAD.left+ri*groupW, cx=gx+groupW/2;
            const scores=RACE_DATA[r.id].scores;
            const maxS=Math.max(...PARTICIPANTS.map(p=>scores[p]||0));
            const isH=hovR===ri;
            return (
              <g key={r.id} onMouseEnter={()=>setHovR(ri)}>
                {isH&&<rect x={gx+2} y={PAD.top} width={groupW-4} height={IH} fill="#ffffff" opacity={0.025} rx={4}/>}
                {PARTICIPANTS.map((p,pi)=>{
                  const s=scores[p]||0;
                  const bx=gx+(groupW-nP*barW)/2+pi*barW;
                  const isTop=s===maxS;
                  return (
                    <g key={p}>
                      <rect x={bx} y={yPos(s)} width={barW-1} height={(s/maxPts)*IH}
                        fill={PM[p].color} opacity={isH?(isTop?1:0.65):(isTop?0.85:0.4)} rx={2}
                        style={{transformOrigin:`${bx}px ${PAD.top+IH}px`,animation:"barRise 0.6s cubic-bezier(0.34,1.2,0.64,1) both",animationDelay:`${(ri*nP+pi)*0.04}s`}}/>
                      {isH&&s>0&&<text x={bx+(barW-1)/2} y={yPos(s)-4} textAnchor="middle"
                        fontSize={8} fill={PM[p].color} fontWeight="700">{s}</text>}
                      {!isH&&isTop&&s>0&&<text x={bx+(barW-1)/2} y={yPos(s)-3} textAnchor="middle"
                        fontSize={7} fill={PM[p].color}>★</text>}
                    </g>
                  );
                })}
                <text x={cx} y={H-PAD.bottom+14} textAnchor="middle" fontSize={9} fontWeight="700"
                  fill={isH?"#9ca3af":"#374151"}>{r.flagCode?.toUpperCase()}</text>
                <text x={cx} y={H-PAD.bottom+27} textAnchor="middle" fontSize={8}
                  fill={isH?"#6b7280":"#1f2937"}>{r.name.slice(0,6)}</text>
              </g>
            );
          })}
          <line x1={PAD.left} x2={PAD.left} y1={PAD.top} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
          <line x1={PAD.left} x2={PAD.left+IW} y1={PAD.top+IH} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
        </svg>
        {hovR!==null&&(()=>{
          const r=races[hovR];
          const scores=RACE_DATA[r.id].scores;
          const sorted=[...PARTICIPANTS].sort((a,b)=>(scores[b]||0)-(scores[a]||0));
          const gx=PAD.left+hovR*groupW;
          const maxS=Math.max(...PARTICIPANTS.map(p=>scores[p]||0));
          return (
            <div style={{position:"absolute",top:16,left:hovR<nR/2?gx+groupW+8:undefined,right:hovR>=nR/2?W-gx+8:undefined,background:"rgba(8,8,8,0.97)",border:"1px solid #1f2937",borderRadius:10,padding:"10px 14px",minWidth:155,pointerEvents:"none",zIndex:10}}>
              <div style={{fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em",marginBottom:8,borderBottom:"1px solid #1a1a1a",paddingBottom:6}}>
                {r.flag} {r.name}
              </div>
              {sorted.map((p,rank)=>{
                const s=scores[p]||0;
                return (
                  <div key={p} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:10,color:"#374151",width:16,textAlign:"right",fontFamily:"monospace"}}>{rank+1}</span>
                    <Avatar name={p} size="sm"/>
                    <span style={{color:PM[p].color,fontWeight:700,fontSize:12,flex:1}}>{p}</span>
                    <span style={{color:s===maxS?"#fbbf24":"white",fontWeight:900,fontSize:13,fontFamily:"monospace"}}>
                      {s}{s===maxS?" ★":""}
                    </span>
                  </div>
                );
              })}
            </div>
          );
        })()}
        <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap",marginTop:8}}>
          {PARTICIPANTS.map(p=>(
            <div key={p} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:12,height:12,background:PM[p].color,borderRadius:2}}/>
              <span style={{fontSize:11,color:PM[p].color,fontWeight:600}}>{p}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}



// ─── HEAD-TO-HEAD COMPONENT ──────────────────────────────────────────────────

function HeadToHead() {
  const [p1, setP1] = useState("Pato");
  const [p2, setP2] = useState("Lucas");

  const completed = RACES.filter(r => r.status === "completado" && RACE_DATA[r.id]);

  // ── Per-race stats ────────────────────────────────────────────────────────
  const raceStats = completed.map(r => {
    const s1 = RACE_DATA[r.id]?.scores?.[p1] || 0;
    const s2 = RACE_DATA[r.id]?.scores?.[p2] || 0;
    // Session-level accuracy
    const sessions = RACE_DATA[r.id]?.sessions || [];
    let hits1 = 0, hits2 = 0;
    sessions.forEach(s => {
      if (s.preds[p1] && s.real && s.preds[p1].toUpperCase() === s.real.toUpperCase()) hits1++;
      if (s.preds[p2] && s.real && s.preds[p2].toUpperCase() === s.real.toUpperCase()) hits2++;
    });
    return {
      race: r, s1, s2,
      winner: s1 > s2 ? p1 : s2 > s1 ? p2 : "tie",
      hits1, hits2, total: sessions.length,
    };
  });

  const total1 = raceStats.reduce((s, r) => s + r.s1, 0);
  const total2 = raceStats.reduce((s, r) => s + r.s2, 0);
  const wins1  = raceStats.filter(r => r.winner === p1).length;
  const wins2  = raceStats.filter(r => r.winner === p2).length;
  const ties   = raceStats.filter(r => r.winner === "tie").length;
  const totalHits1 = raceStats.reduce((s,r) => s+r.hits1, 0);
  const totalHits2 = raceStats.reduce((s,r) => s+r.hits2, 0);
  const totalSess  = raceStats.reduce((s,r) => s+r.total, 0);
  const acc1 = totalSess ? Math.round(totalHits1/totalSess*100) : 0;
  const acc2 = totalSess ? Math.round(totalHits2/totalSess*100) : 0;

  // Session-type breakdown
  const SESSION_TYPES_H2H = [
    {key:"fp",  label:"FP",       prefix:["P1","P2","P3","FP1"]},
    {key:"spq", label:"SPQ",      prefix:["SPQ"]},
    {key:"spr", label:"SPR",      prefix:["SPR"]},
    {key:"q",   label:"Qualy",    prefix:["Q"]},
    {key:"r",   label:"Carrera",  prefix:["R"]},
    {key:"vr",  label:"VR/SPVR",  prefix:["VR","SPVR"]},
  ];

  const sessionBreakdown = SESSION_TYPES_H2H.map(({key, label, prefix}) => {
    let h1=0, h2=0, tot=0;
    completed.forEach(r => {
      (RACE_DATA[r.id]?.sessions||[]).forEach(s => {
        const lbl = s.label.trim().toUpperCase().replace(/[\s\-]+/g,'');
        const matches = prefix.some(p => lbl === p || (lbl.startsWith(p) && /\d/.test(lbl[p.length]||'')));
        if (!matches) return;
        tot++;
        if (s.preds[p1] && s.real && s.preds[p1].toUpperCase()===s.real.toUpperCase()) h1++;
        if (s.preds[p2] && s.real && s.preds[p2].toUpperCase()===s.real.toUpperCase()) h2++;
      });
    });
    return {key, label, h1, h2, tot};
  }).filter(x => x.tot > 0);

  const m1 = PM[p1], m2 = PM[p2];
  const leader = total1 > total2 ? p1 : total2 > total1 ? p2 : null;

  // Bar chart data — points per race
  const W=640, H=200, PAD={top:16,right:16,bottom:40,left:36};
  const IW=W-PAD.left-PAD.right, IH=H-PAD.top-PAD.bottom;
  const nR=raceStats.length;
  const maxPts=Math.max(...raceStats.flatMap(r=>[r.s1,r.s2]),1);
  const groupW=IW/nR;
  const barW=Math.min((groupW-8)/2,28);
  const yPos=v=>PAD.top+IH-(v/maxPts)*IH;

  return (
    <div>
      <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Head-to-Head</p>

      {/* Player selectors */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {PARTICIPANTS.filter(p=>p!==p2).map(p=>(
            <button key={p} onClick={()=>setP1(p)}
              style={{padding:"6px 14px",borderRadius:999,fontSize:12,fontWeight:700,cursor:"pointer",transition:"all 0.15s",
                ...(p1===p?{background:PM[p].color,color:"#000",border:"none"}:{background:`${PM[p].color}18`,color:PM[p].color,border:`1px solid ${PM[p].color}44`})}}>
              {p}
            </button>
          ))}
        </div>
        <span style={{color:"#374151",fontWeight:900,fontSize:16}}>VS</span>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {PARTICIPANTS.filter(p=>p!==p1).map(p=>(
            <button key={p} onClick={()=>setP2(p)}
              style={{padding:"6px 14px",borderRadius:999,fontSize:12,fontWeight:700,cursor:"pointer",transition:"all 0.15s",
                ...(p2===p?{background:PM[p].color,color:"#000",border:"none"}:{background:`${PM[p].color}18`,color:PM[p].color,border:`1px solid ${PM[p].color}44`})}}>
              {p}
            </button>
          ))}
        </div>
      </div>

      {/* Main scoreboard */}
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:20,marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:16,alignItems:"center"}}>

          {/* Player 1 */}
          <div style={{textAlign:"center"}}>
            <Avatar name={p1} size="lg"/>
            <div style={{color:m1.color,fontWeight:900,fontSize:20,marginTop:8}}>{p1}</div>
            <div style={{color:"white",fontWeight:900,fontSize:36,fontFamily:"monospace",lineHeight:1}}>{total1}</div>
            <div style={{color:"#6b7280",fontSize:11}}>pts totales</div>
            {leader===p1&&<div style={{marginTop:6,background:"#78600a55",color:"#fbbf24",border:"1px solid #f59e0b",borderRadius:999,padding:"2px 12px",fontSize:10,fontWeight:700,display:"inline-block"}}>LÍDER</div>}
          </div>

          {/* Center stats */}
          <div style={{textAlign:"center",minWidth:120}}>
            <div style={{fontSize:11,color:"#374151",marginBottom:12,letterSpacing:"0.08em"}}>FECHAS GANADAS</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:16}}>
              <span style={{color:m1.color,fontWeight:900,fontSize:28,fontFamily:"monospace"}}>{wins1}</span>
              <span style={{color:"#374151",fontSize:16,fontWeight:700}}>-</span>
              <span style={{color:"#374151",fontWeight:700,fontSize:14}}>{ties}🤝</span>
              <span style={{color:"#374151",fontSize:16,fontWeight:700}}>-</span>
              <span style={{color:m2.color,fontWeight:900,fontSize:28,fontFamily:"monospace"}}>{wins2}</span>
            </div>
            <div style={{fontSize:11,color:"#374151",letterSpacing:"0.08em"}}>DIFERENCIA</div>
            <div style={{fontWeight:900,fontSize:22,fontFamily:"monospace",
              color:total1>total2?m1.color:total2>total1?m2.color:"#6b7280"}}>
              {total1===total2?"=":`${Math.abs(total1-total2)} pts`}
            </div>
          </div>

          {/* Player 2 */}
          <div style={{textAlign:"center"}}>
            <Avatar name={p2} size="lg"/>
            <div style={{color:m2.color,fontWeight:900,fontSize:20,marginTop:8}}>{p2}</div>
            <div style={{color:"white",fontWeight:900,fontSize:36,fontFamily:"monospace",lineHeight:1}}>{total2}</div>
            <div style={{color:"#6b7280",fontSize:11}}>pts totales</div>
            {leader===p2&&<div style={{marginTop:6,background:"#78600a55",color:"#fbbf24",border:"1px solid #f59e0b",borderRadius:999,padding:"2px 12px",fontSize:10,fontWeight:700,display:"inline-block"}}>LÍDER</div>}
          </div>
        </div>

        {/* Accuracy bars */}
        <div style={{marginTop:20,borderTop:"1px solid #111",paddingTop:16}}>
          <div style={{fontSize:11,color:"#374151",letterSpacing:"0.08em",marginBottom:10,textAlign:"center"}}>PRECISIÓN DE PRONÓSTICOS</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:m1.color,fontWeight:700,fontSize:13,width:32,textAlign:"right"}}>{acc1}%</span>
            <div style={{flex:1,height:8,background:"#111",borderRadius:999,overflow:"hidden",display:"flex"}}>
              <div style={{width:`${acc1/(acc1+acc2||1)*100}%`,background:`linear-gradient(90deg,${m1.color},${m1.color}aa)`,borderRadius:"999px 0 0 999px",transition:"width 0.6s ease"}}/>
              <div style={{flex:1,background:`linear-gradient(90deg,${m2.color}aa,${m2.color})`,borderRadius:"0 999px 999px 0"}}/>
            </div>
            <span style={{color:m2.color,fontWeight:700,fontSize:13,width:32}}>{acc2}%</span>
          </div>
        </div>
      </div>

      {/* Per-race bar chart */}
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16,marginBottom:12,overflowX:"auto"}}>
        <p style={{fontSize:10,color:"#374151",letterSpacing:"0.08em",marginBottom:10}}>PUNTOS POR FECHA</p>
        <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",maxWidth:W}} preserveAspectRatio="xMidYMid meet">
          {[0,20,40,60,80].filter(v=>v<=maxPts+10).map(v=>(
            <g key={v}>
              <line x1={PAD.left} x2={PAD.left+IW} y1={yPos(v)} y2={yPos(v)} stroke="#111" strokeWidth={1}/>
              <text x={PAD.left-4} y={yPos(v)+4} textAnchor="end" fontSize={9} fill="#374151">{v}</text>
            </g>
          ))}
          {raceStats.map((r,ri)=>{
            const gx=PAD.left+ri*groupW;
            const cx=gx+groupW/2;
            return (
              <g key={r.race.id}>
                {/* P1 bar */}
                <rect x={gx+(groupW-barW*2-4)/2} y={yPos(r.s1)} width={barW} height={(r.s1/maxPts)*IH}
                  fill={m1.color} opacity={r.winner===p1?0.95:0.45} rx={2}
                  style={{transformOrigin:`${gx+(groupW-barW*2-4)/2}px ${PAD.top+IH}px`,
                    animation:"barRise 0.6s cubic-bezier(0.34,1.2,0.64,1) both",animationDelay:`${ri*0.08}s`}}/>
                {/* P2 bar */}
                <rect x={gx+(groupW-barW*2-4)/2+barW+4} y={yPos(r.s2)} width={barW} height={(r.s2/maxPts)*IH}
                  fill={m2.color} opacity={r.winner===p2?0.95:0.45} rx={2}
                  style={{transformOrigin:`${gx+(groupW-barW*2-4)/2+barW+4}px ${PAD.top+IH}px`,
                    animation:"barRise 0.6s cubic-bezier(0.34,1.2,0.64,1) both",animationDelay:`${ri*0.08+0.04}s`}}/>
                {/* Score labels */}
                <text x={gx+(groupW-barW*2-4)/2+barW/2} y={yPos(r.s1)-3} textAnchor="middle" fontSize={8} fill={m1.color} fontWeight="700">{r.s1}</text>
                <text x={gx+(groupW-barW*2-4)/2+barW+4+barW/2} y={yPos(r.s2)-3} textAnchor="middle" fontSize={8} fill={m2.color} fontWeight="700">{r.s2}</text>
                {/* Winner indicator */}
                {r.winner!=="tie"&&<text x={cx} y={PAD.top-4} textAnchor="middle" fontSize={8} fill={r.winner===p1?m1.color:m2.color}>●</text>}
                {/* X label */}
                <image href={FLAGS[r.race.flagCode]||""} x={cx-10} y={H-PAD.bottom+6} width={20} height={14}/>
              </g>
            );
          })}
          <line x1={PAD.left} x2={PAD.left} y1={PAD.top} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
          <line x1={PAD.left} x2={PAD.left+IW} y1={PAD.top+IH} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
        </svg>
        <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:8}}>
          {[{n:p1,m:m1},{n:p2,m:m2}].map(({n,m})=>(
            <div key={n} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:12,height:12,background:m.color,borderRadius:2}}/>
              <span style={{fontSize:11,color:m.color,fontWeight:600}}>{n}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Session type breakdown */}
      <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",overflow:"hidden",overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:320}}>
          <thead>
            <tr style={{background:"#0a0a0a",borderBottom:"1px solid #1f2937"}}>
              <th style={{padding:"10px 14px",textAlign:"left",fontSize:11,color:"#6b7280",letterSpacing:"0.08em"}}>SESIÓN</th>
              <th style={{padding:"10px 14px",textAlign:"center",fontSize:11,color:m1.color}}>{p1}</th>
              <th style={{padding:"10px 14px",textAlign:"center",fontSize:11,color:"#374151"}}>TOTAL</th>
              <th style={{padding:"10px 14px",textAlign:"center",fontSize:11,color:m2.color}}>{p2}</th>
            </tr>
          </thead>
          <tbody>
            {sessionBreakdown.map((row,i)=>{
              const pct1=row.tot?Math.round(row.h1/row.tot*100):0;
              const pct2=row.tot?Math.round(row.h2/row.tot*100):0;
              const wins1=row.h1>row.h2, wins2=row.h2>row.h1;
              return (
                <tr key={row.key} style={{borderBottom:"1px solid #0d0d0d",background:i%2===0?"#050505":"transparent"}}>
                  <td style={{padding:"10px 14px",color:"#9ca3af",fontSize:12,fontFamily:"monospace",fontWeight:600}}>{row.label}</td>
                  <td style={{padding:"10px 14px",textAlign:"center"}}>
                    <span style={{color:wins1?m1.color:"#4b5563",fontWeight:wins1?700:400,fontSize:13}}>
                      {row.h1}<span style={{fontSize:10,color:"#374151",fontWeight:400}}> ({pct1}%)</span>
                    </span>
                  </td>
                  <td style={{padding:"10px 14px",textAlign:"center"}}>
                    {/* Progress bar */}
                    {(()=>{
                      const combined=row.h1+row.h2||1;
                      const w1=Math.round(row.h1/combined*100);
                      return <div style={{height:6,background:"#111",borderRadius:999,overflow:"hidden",display:"flex",width:80,margin:"0 auto"}}>
                        <div style={{width:`${w1}%`,background:m1.color,transition:"width 0.6s ease",borderRadius:"999px 0 0 999px"}}/>
                        <div style={{flex:1,background:m2.color,transition:"width 0.6s ease",borderRadius:"0 999px 999px 0"}}/>
                      </div>;
                    })()}
                    <div style={{fontSize:9,color:"#374151",marginTop:3}}>{row.tot} items</div>
                  </td>
                  <td style={{padding:"10px 14px",textAlign:"center"}}>
                    <span style={{color:wins2?m2.color:"#4b5563",fontWeight:wins2?700:400,fontSize:13}}>
                      {row.h2}<span style={{fontSize:10,color:"#374151",fontWeight:400}}> ({pct2}%)</span>
                    </span>
                  </td>
                </tr>
              );
            })}
            {/* Totals row */}
            <tr style={{background:"#0a0a0a",borderTop:"2px solid #1f2937"}}>
              <td style={{padding:"10px 14px",color:"#6b7280",fontSize:11,fontWeight:700,letterSpacing:"0.08em"}}>TOTAL</td>
              <td style={{padding:"10px 14px",textAlign:"center"}}>
                <span style={{color:totalHits1>totalHits2?m1.color:"#9ca3af",fontWeight:700,fontSize:14}}>{totalHits1} ({acc1}%)</span>
              </td>
              <td style={{padding:"10px 14px",textAlign:"center",color:"#374151",fontSize:11}}>{totalSess}</td>
              <td style={{padding:"10px 14px",textAlign:"center"}}>
                <span style={{color:totalHits2>totalHits1?m2.color:"#9ca3af",fontWeight:700,fontSize:14}}>{totalHits2} ({acc2}%)</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}


// ─── POSITION HISTORY COMPONENT ─────────────────────────────────────────────

function PositionHistory() {
  const [view, setView] = useState("chart"); // "chart" | "table"
  const completed = RACES.filter(r => r.status === "completado" && RACE_DATA[r.id]);

  // Build cumulative pts after each race for each participant
  const cumulative = {};
  PARTICIPANTS.forEach(p => { cumulative[p] = 0; });

  // For each race, compute standings position after that race
  const history = completed.map(r => {
    PARTICIPANTS.forEach(p => {
      cumulative[p] += (RACE_DATA[r.id]?.scores?.[p] || 0);
    });
    // Rank participants by cumulative pts (ties broken alphabetically)
    const ranked = [...PARTICIPANTS].sort((a, b) =>
      cumulative[b] - cumulative[a] || a.localeCompare(b)
    );
    const snapshot = {};
    ranked.forEach((p, i) => {
      snapshot[p] = { pos: i + 1, pts: cumulative[p] };
    });
    return { race: r, snapshot };
  });

  // SVG bump chart dimensions
  const W = 680, H = 320;
  const PAD = { top: 28, right: 80, bottom: 36, left: 28 };
  const IW = W - PAD.left - PAD.right;
  const IH = H - PAD.top - PAD.bottom;
  const nRaces = history.length;
  const nP = PARTICIPANTS.length;
  const xPos = i => PAD.left + i * (IW / Math.max(nRaces - 1, 1));
  const yPos = pos => PAD.top + ((pos - 1) / (nP - 1)) * IH;

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div>
          <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:2}}>Historial de Posiciones</p>
          <p style={{fontSize:11,color:"#374151"}}>Clasificación acumulada tras cada fecha</p>
        </div>
        <div style={{display:"flex",gap:4}}>
          {["chart","table"].map(v=>(
            <button key={v} onClick={()=>setView(v)}
              style={{padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",
                ...(view===v?{background:"#dc2626",color:"white",border:"none"}:{background:"#111",border:"1px solid #1f2937",color:"#6b7280"})}}>
              {v==="chart"?"📈 Gráfico":"📋 Tabla"}
            </button>
          ))}
        </div>
      </div>

      {view === "chart" && (
        <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16,overflowX:"auto"}}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{display:"block",width:"100%",maxWidth:W}} preserveAspectRatio="xMidYMid meet">

            {/* Y axis position labels */}
            {Array.from({length:nP},(_,i)=>(
              <text key={i} x={PAD.left-6} y={yPos(i+1)+4} textAnchor="end" fontSize={9} fill="#374151" fontWeight="600">
                P{i+1}
              </text>
            ))}

            {/* Horizontal position lines */}
            {Array.from({length:nP},(_,i)=>(
              <line key={i} x1={PAD.left} x2={PAD.left+IW} y1={yPos(i+1)} y2={yPos(i+1)}
                stroke={i===0?"#2a2a00":"#0f0f0f"} strokeWidth={i===0?1.5:1}/>
            ))}

            {/* X axis labels */}
            {history.map((h,i)=>(
              <g key={i}>
                <image href={FLAGS[h.race.flagCode]||""} x={xPos(i)-10} y={H-PAD.bottom+6} width={20} height={14}
                  style={{borderRadius:2}}/>
                <text x={xPos(i)} y={H-PAD.bottom+26} textAnchor="middle" fontSize={8} fill="#374151">
                  {h.race.name.slice(0,5)}
                </text>
              </g>
            ))}

            {/* Lines per participant */}
            {PARTICIPANTS.map((p, pi) => {
              const color = PM[p].color;
              const points = history.map((h,i) => `${xPos(i)},${yPos(h.snapshot[p].pos)}`).join(" ");
              return (
                <polyline key={p} fill="none" stroke={color} strokeWidth={2.5}
                  strokeLinejoin="round" strokeLinecap="round" opacity={0.9}
                  strokeDasharray="2000" strokeDashoffset="0"
                  style={{animation:"drawLine 1.2s ease forwards", animationDelay:`${pi*0.15}s`}}
                  points={points}/>
              );
            })}

            {/* Dots at each point */}
            {PARTICIPANTS.map((p, pi) =>
              history.map((h, i) => {
                const pos = h.snapshot[p].pos;
                const isLast = i === history.length - 1;
                const color = PM[p].color;
                return (
                  <g key={p+i}>
                    <circle cx={xPos(i)} cy={yPos(pos)} r={isLast ? 5 : 3}
                      fill={isLast ? color : "#050505"} stroke={color} strokeWidth={isLast?2:1.5}
                      style={{animation:"popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both",
                        animationDelay:`${pi*0.15 + i*0.06}s`}}/>
                    {/* Position label on the dot (last point only) */}
                    {isLast && (
                      <text x={xPos(i)+10} y={yPos(pos)+4} fontSize={10} fontWeight="800" fill={color}>
                        {p}
                      </text>
                    )}
                    {/* P1 indicator on first point */}
                    {i === 0 && pos === 1 && (
                      <text x={xPos(i)-8} y={yPos(pos)+4} fontSize={9} textAnchor="end" fill={color} fontWeight="700">
                        {p}
                      </text>
                    )}
                  </g>
                );
              })
            )}

            {/* Axes */}
            <line x1={PAD.left} x2={PAD.left} y1={PAD.top} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>
            <line x1={PAD.left} x2={PAD.left+IW} y1={PAD.top+IH} y2={PAD.top+IH} stroke="#222" strokeWidth={1}/>

            {/* P1 golden band */}
            <rect x={PAD.left} y={PAD.top} width={IW} height={IH/nP}
              fill="#fbbf24" opacity={0.03} rx={2}/>
          </svg>

          {/* Legend */}
          <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap",marginTop:8}}>
            {[...PARTICIPANTS].sort((a,b)=>
              (history[history.length-1]?.snapshot[a]?.pos||99) -
              (history[history.length-1]?.snapshot[b]?.pos||99)
            ).map(p=>{
              const lastPos = history[history.length-1]?.snapshot[p]?.pos;
              const firstPos = history[0]?.snapshot[p]?.pos;
              const diff = firstPos - lastPos; // positive = improved
              return (
                <div key={p} style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:20,height:3,background:PM[p].color,borderRadius:2}}/>
                  <span style={{color:PM[p].color,fontWeight:700,fontSize:11}}>{p}</span>
                  <span style={{fontSize:10,color:"#374151"}}>P{lastPos}</span>
                  {diff!==0&&<span style={{fontSize:9,color:diff>0?"#22c55e":"#ef4444",fontWeight:700}}>
                    {diff>0?`▲${diff}`:`▼${Math.abs(diff)}`}
                  </span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {view === "table" && (
        <div style={{borderRadius:12,border:"1px solid #1f2937",overflow:"hidden",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:400}}>
            <thead>
              <tr style={{background:"#0a0a0a",borderBottom:"1px solid #1f2937"}}>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:11,color:"#6b7280",letterSpacing:"0.08em"}}>JUGADOR</th>
                {history.map(h=>(
                  <th key={h.race.id} style={{padding:"8px 10px",textAlign:"center",fontSize:11,color:"#6b7280"}}>
                    <FlagImg code={h.race.flagCode} size={16}/>
                    <div style={{fontSize:8,color:"#374151",marginTop:2}}>{h.race.name.slice(0,4)}</div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[...PARTICIPANTS].sort((a,b)=>
                (history[history.length-1]?.snapshot[a]?.pos||99) -
                (history[history.length-1]?.snapshot[b]?.pos||99)
              ).map((p, ri) => {
                const meta = PM[p];
                return (
                  <tr key={p} className="anim-slide-in"
                    style={{borderBottom:"1px solid #0d0d0d",background:ri%2===0?"#050505":"transparent",animationDelay:`${ri*0.05}s`}}>
                    <td style={{padding:"10px 14px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <Avatar name={p} size="sm"/>
                        <span style={{color:"white",fontWeight:600,fontSize:13}}>{p}</span>
                      </div>
                    </td>
                    {history.map((h, ci) => {
                      const pos = h.snapshot[p].pos;
                      const prevPos = ci > 0 ? history[ci-1].snapshot[p].pos : null;
                      const changed = prevPos !== null && prevPos !== pos;
                      const improved = prevPos !== null && pos < prevPos;
                      // Medal style for P1/P2/P3
                      const medalBg = pos===1?"#78600a88":pos===2?"#37415188":pos===3?"#43140788":"transparent";
                      const medalColor = pos===1?"#fbbf24":pos===2?"#d1d5db":pos===3?"#fb923c":meta.color;
                      const medalBorder = pos===1?"1px solid #f59e0b":pos===2?"1px solid #9ca3af":pos===3?"1px solid #ea580c":`1px solid ${meta.color}33`;
                      return (
                        <td key={h.race.id} style={{padding:"8px 10px",textAlign:"center"}}>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                            <span style={{background:medalBg,color:medalColor,border:medalBorder,
                              padding:"2px 8px",borderRadius:6,fontSize:12,fontWeight:700,display:"inline-block"}}>
                              P{pos}
                            </span>
                            {changed&&(
                              <span style={{fontSize:8,color:improved?"#22c55e":"#ef4444",fontWeight:700}}>
                                {improved?`▲${prevPos-pos}`:`▼${pos-prevPos}`}
                              </span>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function StatsView(){

    const best=rs.reduce((a,b)=>b.score>a.score?b:a,rs[0]);
    const worst=rs.reduce((a,b)=>b.score<a.score?b:a,rs[0]);
    const avg=Math.round(rs.reduce((s,x)=>s+x.score,0)/rs.length);
    const total=STANDINGS.find(s=>s.name===p)?.pts||0;
    let hits=0,tot=0;
    completed.forEach(r=>{RACE_DATA[r.id].sessions.forEach(s=>{tot++;if(isHit(s.preds[p],s.real))hits++;});});
    const acc=tot?Math.round((hits/tot)*100):0;
    return {name:p,total,avg,best,worst,acc};

  const podiumCounts={};

              <span style={{color:"#6b7280",fontSize:10}} className="hide-mobile">Líder:</span>
              <span style={{color:lm.color,fontSize:11,fontWeight:700}}>{leader.name}</span>
              <span style={{color:"#4b5563",fontSize:11}}>{leader.pts}<span className="hide-mobile"> pts</span></span>
            </div>
          </div>
          {/* Desktop nav tabs */}
          <div className="hide-mobile" style={{display:"flex",gap:2}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:"7px 14px",fontSize:11,fontWeight:600,letterSpacing:"0.05em",borderRadius:"8px 8px 0 0",transition:"color 0.2s, background 0.2s",cursor:"pointer",...(tab===t.id?{color:"white",borderTop:"2px solid #dc2626",background:"#0a0a0a"}:{color:"#4b5563",background:"none",border:"none"})}}>
                <span style={{marginRight:5}}>{t.icon}</span>{t.label}
              </button>
            ))}
          </div>
        </div>
      </header>
      {/* Mobile bottom nav */}
      <div className="show-mobile-only" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:30,background:"rgba(7,7,7,0.97)",borderTop:"1px solid #1f2937",display:"flex",paddingBottom:"env(safe-area-inset-bottom)"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,padding:"10px 4px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",background:"none",border:"none",transition:"all 0.15s"}}>
            <span style={{fontSize:18,lineHeight:1}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:600,letterSpacing:"0.05em",color:tab===t.id?"white":"#4b5563"}}>{t.label.toUpperCase()}</span>
            {tab===t.id&&<div style={{width:16,height:2,background:"#dc2626",borderRadius:1}}/>}
          </button>
        ))}
      </div>
      <main style={{maxWidth:900,margin:"0 auto",padding:"24px 16px 100px"}}>
        {tab==="standings"&&<div key="standings" className="anim-fade-up"><StandingsView onSelectRace={id=>{setSelectedRace(id);setTab("races");}}/></div>}}
        {tab==="calendar" &&<div key="calendar" className="anim-fade-up"><CalendarView  onSelectRace={id=>{setSelectedRace(id);setTab("races");}}/></div>}}
        {tab==="races"    &&<div key="races" className="anim-fade-up"><RaceView initialRace={selectedRace} onSelectRace={id=>{setSelectedRace(id);}}/></div>}}
        {tab==="stats"    &&<div key="stats" className="anim-fade-up"><StatsView/></div>}
      </main>
      <footer className="hide-mobile" style={{maxWidth:900,margin:"0 auto",padding:"24px 16px",borderTop:"1px solid #0d0d0d"}}>
        <p style={{textAlign:"center",color:"#374151",fontSize:11}}>PRODE F1 2026 · {RACES.filter(r=>r.status==="completado").length} de {RACES.length} fechas · Actualizado hasta Hungría (Rd 11) — completo</p>
      </footer>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
