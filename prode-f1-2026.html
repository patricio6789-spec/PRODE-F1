// ─── HELPERS ─────────────────────────────────────────────────────────────────
const ABBRMAP = {VERSTAPPEN:"VER",ANTONELLI:"ANT",HAMILTON:"HAM",RUSSELL:"RUS",LECLERC:"LEC",PIASTRI:"PIA",NORRIS:"NOR",HADJAR:"HAD",COLAPINTO:"COL",BEARMAN:"BEA",GASLY:"GAS",ALONSO:"ALO",LINDBLAD:"LIN",OCON:"OCO",HULKENBERG:"HUL",LAWSON:"LAW",BORTOLETO:"BOR",SAINZ:"SAI",ALBON:"ALB"};
function abbr(n){ if(!n||n==="–"||n==="-") return "–"; const u=n.trim().toUpperCase(); return ABBRMAP[u]||u.slice(0,3); }
function isHit(p,r){ if(!p||!r||p==="–"||p==="-") return false; return p.trim().toUpperCase()===r.trim().toUpperCase(); }
function medalStyle(rank){
  if(rank===0) return {background:"#78600a88",color:"#fbbf24",border:"1px solid #f59e0b"};
  if(rank===1) return {background:"#37415188",color:"#d1d5db",border:"1px solid #9ca3af"};
  if(rank===2) return {background:"#43140788",color:"#fb923c",border:"1px solid #ea580c"};
  return {color:"#6b7280"};
}


function FlagImg({code, size=20}) {
  const src = FLAGS[code];
  if (!src) return <span style={{fontSize:size*0.9}}></span>;
  return <img src={src} alt={code} style={{width:size*1.4, height:size, objectFit:"cover", borderRadius:2, verticalAlign:"middle", display:"inline-block"}} />;
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function StatsView(){
  const completed=RACES.filter(r=>r.status==="completado"&&RACE_DATA[r.id]);
  const stats=PARTICIPANTS.map(p=>{
    const rs=completed.map(r=>({race:r,score:RACE_DATA[r.id]?.scores?.[p]||0}));
    const best=rs.reduce((a,b)=>b.score>a.score?b:a,rs[0]);
    const worst=rs.reduce((a,b)=>b.score<a.score?b:a,rs[0]);
    const avg=Math.round(rs.reduce((s,x)=>s+x.score,0)/rs.length);
    const total=STANDINGS.find(s=>s.name===p)?.pts||0;
    let hits=0,tot=0;
    completed.forEach(r=>{RACE_DATA[r.id].sessions.forEach(s=>{tot++;if(isHit(s.preds[p],s.real))hits++;});});
    const acc=tot?Math.round((hits/tot)*100):0;
    return {name:p,total,avg,best,worst,acc};
  });
  const podiumCounts={};
  PARTICIPANTS.forEach(p=>{podiumCounts[p]={gold:0,silver:0,bronze:0};});
  completed.forEach(r=>{
    const sc=RACE_DATA[r.id].scores;
    const ranked=[...PARTICIPANTS].sort((a,b)=>(sc[b]||0)-(sc[a]||0));
    if(ranked[0])podiumCounts[ranked[0]].gold++;
    if(ranked[1])podiumCounts[ranked[1]].silver++;
    if(ranked[2])podiumCounts[ranked[2]].bronze++;
  });
  const raceRankings=completed.map(r=>{const sc=RACE_DATA[r.id].scores;return{race:r,ranked:[...PARTICIPANTS].sort((a,b)=>(sc[b]||0)-(sc[a]||0))};});

  return (
    <div style={{display:"flex",flexDirection:"column",gap:"2.5rem"}}>

      {/* Summary cards */}
      <div>
        <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:16}}>Resumen por Jugador</p>

          {[...stats].sort((a,b)=>b.total-a.total).map((s,i)=>{
            const m=PM[s.name]; const rs=medalStyle(i);
            return (
              <div key={s.name} style={{border:`1px solid ${m.color}33`,background:`${m.color}07`,borderRadius:12,padding:16,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <Avatar name={s.name} size="md"/>
                    <div><div style={{color:"white",fontWeight:700}}>{s.name}</div><div style={{color:"#6b7280",fontSize:11}}>{m.country}</div></div>
                  </div>
                  <div style={{...rs,fontSize:22,fontWeight:900,padding:"4px 10px",borderRadius:8}}>{s.total}</div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {[{k:"gold",l:"🥇",r:0},{k:"silver",l:"🥈",r:1},{k:"bronze",l:"🥉",r:2}].map(({k,l,r})=>(
                    <div key={k} style={{...medalStyle(r),flex:1,padding:"4px 6px",borderRadius:8,textAlign:"center"}}>
                      <div style={{fontSize:16}}>{l}</div>
                      <div style={{fontWeight:900,fontSize:15}}>{podiumCounts[s.name][k]}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                  {[{label:"Promedio",val:s.avg,color:"white"},{label:"Mejor",val:s.best?.score,extra:s.best?.race.flag,color:"#34d399"},{label:"Peor",val:s.worst?.score,extra:s.worst?.race.flag,color:"#f87171"}].map(item=>(

                    <span style={{color:"#6b7280"}}>Precisión</span><span style={{color:m.color}}>{s.acc}%</span>
                  </div>
                  <div style={{height:6,background:"#111",borderRadius:999,overflow:"hidden"}}>
                    <div style={{width:`${s.acc}%`,background:m.color,height:"100%",borderRadius:999}}/>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Session wins */}
      <div>
        <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Victorias por Sesión</p>
        <div style={{borderRadius:12,border:"1px solid #1f2937",overflow:"hidden",overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#0a0a0a",borderBottom:"1px solid #1f2937"}}>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:11,color:"#6b7280",letterSpacing:"0.08em"}}>SESIÓN</th>
                {PARTICIPANTS.map(p=>{const m=PM[p];return(
                  <th key={p} style={{padding:"10px 8px",textAlign:"center"}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                      <span></span>
                      <span style={{color:m.color,fontSize:11,fontWeight:600}}>{p}</span>
                    </div>
                  </th>
                );})}
              </tr>
            </thead>
            <tbody>
              {SESSION_ORDER.map((key,i)=>{
                const wins=SESSION_WINS[key]||{};
                const counts=PARTICIPANTS.map(p=>wins[p]?.length||0);
                const maxW=Math.max(...counts);
                const sortedC=[...counts].sort((a,b)=>b-a);
                return (
                  <tr key={key} style={{borderBottom:"1px solid #0d0d0d",background:i%2===0?"#050505":"transparent"}}>
                    <td style={{padding:"8px 14px",color:"#9ca3af",fontSize:12,fontFamily:"monospace",fontWeight:600}}>{SESSION_LABELS[key]}</td>
                    {PARTICIPANTS.map((p,pi)=>{
                      const w=wins[p]||[]; const cnt=w.length;
                      const rank=cnt>0?sortedC.indexOf(cnt):-1;
                      const rs=rank>=0&&rank<=2?medalStyle(rank):{};
                      return <td key={p} style={{padding:"8px 8px",textAlign:"center"}}>
                        {cnt>0?(
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                            <span style={{...rs,padding:"1px 8px",borderRadius:6,fontWeight:700,fontSize:15}}>{cnt}</span>
                            <span style={{display:"flex",gap:3,justifyContent:"center"}}>{w.map(rid=>{const rc=RACES.find(r=>r.id===rid);return rc?<FlagImg key={rid} code={rc.flagCode} size={14}/>:null;})}</span>
                          </div>
                        ):<span style={{color:"#1f2937",fontSize:11}}>–</span>}
                      </td>;
                    })}
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{background:"#0a0a0a",borderTop:"2px solid #1f2937"}}>
                <td style={{padding:"10px 14px",fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em"}}>TOTAL</td>
                {PARTICIPANTS.map(p=>{
                  const total=Object.values(SESSION_WINS).reduce((s,w)=>s+(w[p]?.length||0),0);
                  const allT=PARTICIPANTS.map(pp=>Object.values(SESSION_WINS).reduce((s,w)=>s+(w[pp]?.length||0),0));
                  const rank=[...allT].sort((a,b)=>b-a).indexOf(total);
                  const rs=rank<=2?medalStyle(rank):{color:"#9ca3af"};
                  return <td key={p} style={{padding:"10px 8px",textAlign:"center"}}><span style={{...rs,padding:"2px 10px",borderRadius:8,fontWeight:800,fontSize:15}}>{total}</span></td>;
                })}
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

  
      {/* Session losses */}
      <div>
        <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Peores Puntuaciones por Sesión</p>
        <div style={{borderRadius:12,border:"1px solid #1f2937",overflow:"hidden",overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#0a0a0a",borderBottom:"1px solid #1f2937"}}>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:11,color:"#6b7280",letterSpacing:"0.08em"}}>SESIÓN</th>
                {PARTICIPANTS.map(p=>{const m=PM[p];return(
                  <th key={p} style={{padding:"10px 8px",textAlign:"center"}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                      <Avatar name={p} size="sm"/>
                      <span style={{color:m.color,fontSize:11,fontWeight:600}}>{p}</span>
                    </div>
                  </th>
                );})}
              </tr>
            </thead>
            <tbody>
              {["fp1","fp2","fp3","spq","spr","q","r"].map((key,i)=>{
                const losses=SESSION_LOSSES[key]||{};
                const counts=PARTICIPANTS.map(p=>losses[p]?.length||0);
                const maxL=Math.max(...counts);
                const sortedC=[...counts].sort((a,b)=>b-a);
                return (
                  <tr key={key} style={{borderBottom:"1px solid #0d0d0d",background:i%2===0?"#050505":"transparent"}}>
                    <td style={{padding:"8px 14px",color:"#9ca3af",fontSize:12,fontFamily:"monospace",fontWeight:600}}>{SESSION_LABELS[key]}</td>
                    {PARTICIPANTS.map((p,pi)=>{
                      const w=losses[p]||[]; const cnt=w.length;
                      const rank=cnt>0?sortedC.indexOf(cnt):-1;
                      // Reverse medal: most losses = worst = "gold" but in red tones
                      const lossStyle = rank===0 ? {background:"#7f1d1d88",color:"#fca5a5",border:"1px solid #ef4444",padding:"1px 8px",borderRadius:6,fontWeight:700,fontSize:15}
                                      : rank===1 ? {background:"#78350f88",color:"#fcd34d",border:"1px solid #f59e0b",padding:"1px 8px",borderRadius:6,fontWeight:700,fontSize:15}
                                      : rank===2 ? {background:"#1c1917aa",color:"#a8a29e",border:"1px solid #78716c",padding:"1px 8px",borderRadius:6,fontWeight:700,fontSize:15}
                                      : {};
                      return <td key={p} style={{padding:"8px 8px",textAlign:"center"}}>
                        {cnt>0?(
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                            <span style={lossStyle}>{cnt}</span>
                            <span style={{display:"flex",gap:3,justifyContent:"center"}}>{w.map(rid=>{const rc=RACES.find(r=>r.id===rid);return rc?<FlagImg key={rid} code={rc.flagCode} size={14}/>:null;})}</span>
                          </div>
                        ):<span style={{color:"#1f2937",fontSize:11}}>–</span>}
                      </td>;
                    })}
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{background:"#0a0a0a",borderTop:"2px solid #1f2937"}}>
                <td style={{padding:"10px 14px",fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:"0.08em"}}>TOTAL</td>
                {PARTICIPANTS.map(p=>{
                  const total=Object.values(SESSION_LOSSES).reduce((s,w)=>s+(w[p]?.length||0),0);
                  const allT=PARTICIPANTS.map(pp=>Object.values(SESSION_LOSSES).reduce((s,w)=>s+(w[pp]?.length||0),0));
                  const rank=[...allT].sort((a,b)=>b-a).indexOf(total);
                  const rs = rank===0 ? {background:"#7f1d1d88",color:"#fca5a5",border:"1px solid #ef4444"}
                           : rank===1 ? {background:"#78350f88",color:"#fcd34d",border:"1px solid #f59e0b"}
                           : rank===2 ? {background:"#1c1917aa",color:"#a8a29e",border:"1px solid #78716c"}
                           : {color:"#9ca3af"};
                  return <td key={p} style={{padding:"10px 8px",textAlign:"center"}}><span style={{...rs,padding:"2px 10px",borderRadius:8,fontWeight:800,fontSize:15}}>{total||"–"}</span></td>;
                })}
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

    {/* Race podiums */}
      <div>
        <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Podio por Fecha</p>
        <div style={{borderRadius:12,border:"1px solid #1f2937",overflow:"hidden",overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#0a0a0a",borderBottom:"1px solid #1f2937"}}>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:11,color:"#6b7280",letterSpacing:"0.08em"}}>FECHA</th>
                {["🥇 1°","🥈 2°","🥉 3°","4°","5°","6°"].map((l,i)=>(
                  <th key={i} style={{padding:"10px 10px",fontSize:11,textAlign:"center",color:i===0?"#fbbf24":i===1?"#d1d5db":i===2?"#fb923c":"#4b5563"}}>{l}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {raceRankings.map(({race,ranked},i)=>{
                const sc=RACE_DATA[race.id].scores;
                return (
                  <tr key={race.id} style={{borderBottom:"1px solid #0d0d0d",background:i%2===0?"#050505":"transparent"}}>
                    <td style={{padding:"8px 14px"}}><span style={{marginRight:6}}>{race.flag}</span><span style={{color:"#d1d5db",fontSize:13}}>{race.name}</span></td>
                    {ranked.map((p,ri)=>{
                      const rs=medalStyle(ri);
                      return <td key={p} style={{padding:"8px 10px",textAlign:"center"}}>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                          <span style={{...rs,padding:"1px 8px",borderRadius:6,fontWeight:700,fontSize:12}}>{p}</span>
                          <span style={{color:"#6b7280",fontSize:10}}>{sc[p]}</span>
                        </div>
                      </td>;
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Bar chart */}
      <div>
        <p style={{fontSize:11,color:"#6b7280",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Puntos por Fecha — Barras</p>
        <div style={{background:"#050505",borderRadius:12,border:"1px solid #1f2937",padding:16}}>
          {PARTICIPANTS.map(p=>{
            const m=PM[p];
            return (
              <div key={p} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{width:60,display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                  <span style={{fontSize:13}}></span>
                  <span style={{color:m.color,fontSize:11,fontWeight:700}}>{p}</span>
                </div>
                <div style={{flex:1,display:"flex",gap:4,height:28}}>
                  {completed.map(r=>{
                    const score=RACE_DATA[r.id]?.scores?.[p]||0;
                    const h=Math.max((score/80)*100,2);
                    return (
                      <div key={r.id} title={`${r.name}: ${score} pts`} style={{flex:1,background:`${m.color}18`,borderRadius:4,position:"relative",overflow:"hidden"}}>
                        <div style={{position:"absolute",bottom:0,left:0,right:0,height:`${h}%`,background:m.color,borderRadius:"2px 2px 0 0",opacity:0.85}}/>
                        <span style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:9,color:"white",fontWeight:700,zIndex:1}}>{score}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{width:36,textAlign:"right",flexShrink:0}}>
                  <span style={{color:m.color,fontSize:13,fontWeight:900}}>{STANDINGS.find(s=>s.name===p)?.pts}</span>
                </div>
              </div>
            );
          })}
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:4}}>
            <div style={{width:60}}/>
            <div style={{flex:1,display:"flex",gap:4}}>
              {completed.map(r=><div key={r.id} style={{flex:1,textAlign:"center",fontSize:16}}><FlagImg code={r.flagCode} size={22} /></div>)}
            </div>
            <div style={{width:36,textAlign:"right",fontSize:10,color:"#4b5563"}}>TOT</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("standings");
  const leader=STANDINGS[0]; const lm=PM[leader.name];
  const TABS=[{id:"standings",label:"Tabla",icon:"🏆"},{id:"calendar",label:"Calendario",icon:"📅"},{id:"races",label:"Fechas",icon:"🏎️"},{id:"stats",label:"Estadísticas",icon:"📊"}];

  function goToRace(id){setTab("races");}

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#070707 0%,#0f0f0f 60%,#040404 100%)",fontFamily:"'Inter','Helvetica Neue',Arial,sans-serif"}}>
      <header style={{borderBottom:"1px solid #111",backdropFilter:"blur(12px)",position:"sticky",top:0,zIndex:20,background:"rgba(7,7,7,0.92)"}}>
        <div style={{maxWidth:900,margin:"0 auto",padding:"0 16px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:12,paddingBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,background:"#dc2626",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🏎️</div>
              <div>
                <div style={{color:"white",fontWeight:900,fontSize:18,letterSpacing:"-0.02em",lineHeight:1}}>PRODE F1</div>
                <div style={{color:"#4b5563",fontSize:11,letterSpacing:"0.15em"}}>TEMPORADA 2026</div>
              </div>
            </div>
            <div style={{background:"#0a0a0a",border:"1px solid #1f2937",borderRadius:999,padding:"6px 12px",display:"flex",alignItems:"center",gap:8}}>
              <Avatar name={leader.name} size="sm"/>
              <span style={{color:"#6b7280",fontSize:11}}>Líder:</span>
              <span style={{color:lm.color,fontSize:11,fontWeight:700}}>{leader.name}</span>
              <span style={{color:"#4b5563",fontSize:11}}>{leader.pts} pts</span>
            </div>
          </div>
          <div style={{display:"flex",gap:2}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"8px 16px",fontSize:11,fontWeight:600,letterSpacing:"0.05em",borderRadius:"8px 8px 0 0",transition:"all 0.15s",...(tab===t.id?{color:"white",borderTop:"2px solid #dc2626",background:"#0a0a0a"}:{color:"#4b5563"})}}>
                <span style={{marginRight:6}}>{t.icon}</span>{t.label}
              </button>
            ))}
          </div>
        </div>
      </header>
      <main style={{maxWidth:900,margin:"0 auto",padding:"32px 16px"}}>
        {tab==="standings"&&<StandingsView onSelectRace={id=>{setTab("races");}}/>}
        {tab==="calendar" &&<CalendarView  onSelectRace={id=>{setTab("races");}}/>}
        {tab==="races"    &&<RaceView/>}
        {tab==="stats"    &&<StatsView/>}
      </main>
      <footer style={{maxWidth:900,margin:"0 auto",padding:"24px 16px",borderTop:"1px solid #0d0d0d"}}>
        <p style={{textAlign:"center",color:"#374151",fontSize:11}}>PRODE F1 2026 · {RACES.filter(r=>r.status==="completado").length} de {RACES.length} fechas · Actualizado hasta Mónaco (Rd 6)</p>
      </footer>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
